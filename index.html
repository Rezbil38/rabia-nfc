<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Marianusky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
        height: 100%;
        overscroll-behavior: none;
        touch-action: manipulation;
    }

    body {
        background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0a0a0a 60%, #000000 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        position: fixed;
        inset: 0;
    }

    /* Partículas doradas flotando de fondo */
    .heart {
        position: fixed;
        bottom: -50px;
        color: rgba(212, 175, 110, 0.45);
        font-size: 14px;
        pointer-events: none;
        animation: float 10s linear infinite;
        z-index: 0;
    }

    @keyframes float {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    .card {
        width: 100%;
        max-width: 390px;
        height: 100vh;
        height: 100dvh;
        max-height: 844px;
        background: linear-gradient(175deg, #141414 0%, #0c0c0c 100%);
        border: 1px solid rgba(212, 175, 110, 0.18);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: calc(34px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom)) 20px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        position: relative;
        z-index: 1;
        border-radius: 22px;
        overflow: hidden;
    }

    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(175deg, #151515 0%, #0a0a0a 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        border-radius: 22px;
        padding: 20px;
        text-align: center;
    }

    .overlay h2 {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-weight: 500;
        font-size: 30px;
        letter-spacing: 0.5px;
        color: #e8d4ab;
        margin-bottom: 30px;
    }

    .overlay-sub {
        font-size: 13px;
        letter-spacing: 0.4px;
        color: rgba(232, 212, 171, 0.6);
        margin-bottom: 28px;
        text-transform: uppercase;
    }

    .divider {
        width: 40px;
        height: 1px;
        background: rgba(212, 175, 110, 0.6);
        margin-bottom: 22px;
    }

    /* ============ MARCO DE LA FOTO Y ESTILOS ELEGANTES ============ */
    .photo-frame {
        width: 100%;
        flex: 1;
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 24px;
        background: #0d0d0d;
        box-shadow:
            inset 0 0 0 1px rgba(212, 175, 110, 0.25),
            0 20px 45px rgba(0, 0, 0, 0.6);
    }

    .frame-inner {
        position: absolute;
        inset: 0;
    }

    .frame-inner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.8s ease-in-out, transform 6s ease-out, filter 0.8s ease;
        filter: saturate(0.95) contrast(1.08) brightness(0.95);
        transform: scale(1.05);
    }

    .frame-inner img.show {
        opacity: 1;
        transform: scale(1);
    }

    /* Viñeta sutil y borde interior resplandeciente */
    .frame-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, transparent 45%, rgba(0, 0, 0, 0.65) 100%);
        box-shadow: inset 0 0 15px rgba(212, 175, 110, 0.15);
        z-index: 2;
        pointer-events: none;
    }

    .text-slide {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 36px 24px 24px;
        background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0) 100%);
        text-align: center;
        z-index: 3;
    }

    #card.text-mode .frame-inner,
    #card.text-mode .frame-vignette {
        display: none;
    }

    #card.text-mode .text-slide {
        position: static;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        padding: 0 10px;
    }

    #card.text-mode .caption {
        font-size: 28px;
        line-height: 1.45;
    }

    .caption {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-weight: 500;
        color: #f1e2bf;
        text-align: center;
        font-size: 20px;
        letter-spacing: 0.3px;
        min-height: 24px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
        transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .caption.fade-out {
        opacity: 0;
        transform: translateY(-5px);
    }

    .caption-note {
        display: block;
        margin-top: 8px;
        font-size: 13px;
        font-style: normal;
        letter-spacing: 0.2px;
        color: rgba(232, 212, 171, 0.75);
    }

    /* ============ MOSAICO ELEGANTE (CON FONDO SEMITRANSPARENTE) ============ */
    .mosaic-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        overflow: hidden;
    }

    .glow-pulse {
        position: absolute;
        inset: -25%;
        background: radial-gradient(circle at 50% 42%, rgba(232, 212, 171, 0.20), transparent 62%);
        animation: pulseGlow 7s ease-in-out infinite;
        z-index: 1;
    }

    @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.1); }
    }

    .mosaic-item {
        position: absolute;
        color: #f3e3c3;
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        letter-spacing: 0.3px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        white-space: nowrap;
        opacity: 0;
        filter: blur(3px);
        transform: scale(0.82) translateY(16px);
        transition: opacity 1.1s ease, transform 1.6s ease, filter 1.1s ease;
        z-index: 2;
        padding: 6px 14px;
        border-radius: 12px;
        background: rgba(10, 10, 10, 0.65);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1px solid rgba(212, 175, 110, 0.25);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .mosaic-item.show {
        opacity: 0.98;
        filter: blur(0);
        transform: scale(1) translateY(-8px);
    }

    .mosaic-item.far {
        opacity: 0;
        color: rgba(232, 212, 171, 0.85);
        background: rgba(10, 10, 10, 0.45);
        border-color: rgba(212, 175, 110, 0.15);
    }

    .mosaic-item.far.show {
        opacity: 0.65;
        filter: blur(1px);
    }

    .mosaic-item.emoji {
        font-family: 'Montserrat', sans-serif;
        font-style: normal;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }

    .button-container {
        width: 100%;
        display: flex;
        gap: 12px;
        justify-content: center;
    }

    .button-container.single {
        justify-content: center;
    }

    .btn {
        padding: 14px 24px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease, background-color 0.2s ease;
        text-align: center;
    }

    .btn:active:not(:disabled) {
        transform: scale(0.96);
    }

    .button-container:not(.single) .btn {
        flex: 1;
    }

    .btn-primary {
        background: transparent;
        color: #e8d4ab;
        border: 1px solid rgba(212, 175, 110, 0.6);
    }

    .btn-primary:hover:not(:disabled) {
        background: rgba(212, 175, 110, 0.08);
    }

    .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        border-color: rgba(212, 175, 110, 0.25);
    }

    .btn-success {
        background: linear-gradient(135deg, #f1e2bf, #d9b877);
        color: #16130c;
        box-shadow: 0 8px 20px rgba(212, 175, 110, 0.25);
    }

    .btn-danger {
        background: transparent;
        color: #999;
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: top 0.22s ease, left 0.22s ease, transform 0.15s ease, background 0.2s ease, color 0.2s ease;
        z-index: 20;
    }

    .btn-danger.floating {
        background: rgba(8, 8, 8, 0.92);
        color: #e8d4ab;
        border: 1px solid rgba(212, 175, 110, 0.75);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
    }

    .hidden {
        display: none !important;
    }

    .retry-audio {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(232, 212, 171, 0.95);
        color: #111;
        border: none;
        padding: 9px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2px;
        z-index: 30;
        box-shadow: 0 6px 16px rgba(0,0,0,0.35);
        cursor: pointer;
        animation: pulse-in 0.3s ease;
    }

    @keyframes pulse-in {
        from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    #spotify-embed {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
        overflow: hidden;
    }
</style>
</head>
<body>

<div class="card text-mode" id="card">
    <div class="overlay" id="start-overlay">
        <h2>Toca para empezar</h2>
        <div class="divider"></div>
        <p class="overlay-sub">Y escucha este temazazo</p>
        <button class="btn btn-primary" onclick="startApp()">Entrar</button>
    </div>

    <div id="spotify-embed"></div>

    <button class="retry-audio hidden" id="retry-audio" onclick="retryAudio()">🔊 Toca aquí si no escuchas la música</button>

    <div class="photo-frame" id="photo-frame">
        <div class="frame-inner">
            <img id="main-image" src="" alt="Imagen actual">
        </div>
        <div class="frame-vignette"></div>
        <div class="mosaic-container hidden" id="mosaic-container">
            <div class="glow-pulse"></div>
        </div>
        <div class="text-slide">
            <p class="caption" id="caption-text"></p>
        </div>
    </div>

    <div class="button-container single" id="step-1-buttons">
        <button class="btn btn-primary" id="btn-next-step1" onclick="goToGifStep()" disabled>Espera (15s)</button>
    </div>

    <div class="button-container hidden single" id="step-gif-buttons">
        <button class="btn btn-primary" onclick="goToStep2()">Siguiente</button>
    </div>

    <div class="button-container hidden" id="step-2-buttons">
        <button class="btn btn-success" onclick="chooseOption('si')">Sí</button>
        <button class="btn btn-danger" id="no-btn">No</button>
    </div>
</div>

<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>

<script>
    const spotifyTrackId = "2bvpGAr0UUflIcj1d2mRAx";
    const startSongAtSecond = 0;

    // Se especifica la URL CDN completa idéntica al resto de fotos
    const images = {
        gifStep: "http://raw.githubusercontent.com/Rezbil38/rabia-nfc/refs/heads/main/nerv.gif",
        step2: "https://cdn.jsdelivr.net/gh/Rezbil38/rabia-nfc@main/foto1.jpg",
        optionYes: "https://cdn.jsdelivr.net/gh/Rezbil38/rabia-nfc@main/foto2.jpg"
    };

    // Precargar el GIF en memoria desde el primer segundo para que no se quede en blanco en iPhone
    const preloadGif = new Image();
    preloadGif.src = images.gifStep;

    const step1Phrases = [
        "Fuiste engañada 😈, porque...",
        "Te tengo una pregunta :)",
        "Qué crees que es?",
        "Es re obvio sjajjajsj",
        "o no?",
       "      "
    ];

    const finalWords = [
        "Que rabia",
        "🖤✨🖤",
        "Mi persona favorita ✦",
        "❤️🖤",
        "La salamandra???",
        "E N C A N T A S ❤️",
        "Encacorrado 🫠",
        "🫶🏼",
        "Un afortunado",
        "✦ ✦ ✦",
        "Menos mal jeje 😉",
        "❤️🖤🤍",
        "Te quiero mucho 🖤",
        "Feliz :)",
        "El mejor elemento ⭐",
        "🔥❤️"
    ];

    const captions = {
        step2: "¿Quieres ser mi novia?",
        optionYes: 'Me E N C A N TASSSS ❤️🖤❤️🖤    que rabia<span class="caption-note">(igual el botón de no, no funcionaba jeje)</span>'
    };

    const mainImage = document.getElementById('main-image');
    const captionText = document.getElementById('caption-text');
    const step1Buttons = document.getElementById('step-1-buttons');
    const stepGifButtons = document.getElementById('step-gif-buttons');
    const step2Buttons = document.getElementById('step-2-buttons');
    const startOverlay = document.getElementById('start-overlay');
    const btnNextStep1 = document.getElementById('btn-next-step1');
    const mosaicContainer = document.getElementById('mosaic-container');

    let spotifyController = null;
    let phraseInterval = null;
    let mosaicInterval = null;

    function spawnHearts() {
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = '✦';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (10 + Math.random() * 10) + 'px';
            heart.style.animationDuration = (8 + Math.random() * 5) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 14000);
        }, 900);
    }
    spawnHearts();

    function setImage(src, caption) {
        mainImage.classList.remove('show');
        setTimeout(() => {
            mainImage.src = src;
            captionText.innerHTML = caption || '';
            mainImage.onload = () => mainImage.classList.add('show');
            if (mainImage.complete) mainImage.classList.add('show');
        }, 300);
    }

    const card = document.getElementById('card');
    captionText.textContent = step1Phrases[0];

    function startPhraseCycle() {
        let index = 0;
        phraseInterval = setInterval(() => {
            captionText.classList.add('fade-out');
            setTimeout(() => {
                index = (index + 1) % step1Phrases.length;
                captionText.textContent = step1Phrases[index];
                captionText.classList.remove('fade-out');
            }, 350);
        }, 3000);
    }

    function startCountdown() {
        let timeLeft = 15;
        btnNextStep1.disabled = true;
        btnNextStep1.textContent = `Espera (${timeLeft}s)`;

        const countdownInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                btnNextStep1.textContent = `Espera (${timeLeft}s)`;
            } else {
                clearInterval(countdownInterval);
                btnNextStep1.disabled = false;
                btnNextStep1.textContent = "Siguiente";
            }
        }, 1000);
    }

    // ============ SPOTIFY API ============
    let isCurrentlyPlaying = false;
    let hasStartedOnce = false;
    let autoResumedOnce = false;
    const retryAudioBtn = document.getElementById('retry-audio');

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
        const element = document.getElementById('spotify-embed');
        const options = {
            uri: 'spotify:track:' + spotifyTrackId,
            width: '1',
            height: '1'
        };
        const callback = (EmbedController) => {
            spotifyController = EmbedController;
            spotifyController.addListener('playback_update', (e) => {
                if (!e.data) return;
                const nowPlaying = e.data.isPaused === false;

                if (nowPlaying) {
                    hasStartedOnce = true;
                }

                if (hasStartedOnce && isCurrentlyPlaying && !nowPlaying && !autoResumedOnce) {
                    autoResumedOnce = true;
                    setTimeout(() => {
                        if (spotifyController) spotifyController.play();
                    }, 400);
                }

                isCurrentlyPlaying = nowPlaying;
            });
        };
        IFrameAPI.createController(element, options, callback);
    };

    function startApp() {
        const tryPlay = () => {
            spotifyController.play();
            const seekTimeMs = startSongAtSecond * 1000;
            [300, 900].forEach(delay => {
                setTimeout(() => {
                    if (spotifyController) spotifyController.seek(seekTimeMs);
                }, delay);
            });

            setTimeout(() => {
                if (!isCurrentlyPlaying) {
                    retryAudioBtn.classList.remove('hidden');
                }
            }, 1800);
        };

        if (spotifyController) {
            tryPlay();
        } else {
            const waitForController = setInterval(() => {
                if (spotifyController) {
                    tryPlay();
                    clearInterval(waitForController);
                }
            }, 200);
        }

        startOverlay.classList.add('hidden');
        startPhraseCycle();
        startCountdown();
    }

    function retryAudio() {
        if (spotifyController) {
            spotifyController.play();
            setTimeout(() => spotifyController.seek(startSongAtSecond * 1000), 300);
        }
        retryAudioBtn.classList.add('hidden');
    }

    // Pantalla del GIF animado
    function goToGifStep() {
        if (phraseInterval) clearInterval(phraseInterval);
        card.classList.remove('text-mode');

        // Se asigna forzadamente con timestamp para asegurar refresco en iOS Safari
        setImage(images.gifStep + "?v=" + new Date().getTime(), "");

        step1Buttons.classList.add('hidden');
        stepGifButtons.classList.remove('hidden');
    }

    function goToStep2() {
        setImage(images.step2, captions.step2);
        stepGifButtons.classList.add('hidden');
        step2Buttons.classList.remove('hidden');
    }

    function startMosaic() {
        mosaicContainer.classList.remove('hidden');

        function addMosaicElement() {
            const item = document.createElement('div');
            const text = finalWords[Math.floor(Math.random() * finalWords.length)];
            const isFar = Math.random() < 0.35;

            item.className = 'mosaic-item' + (isFar ? ' far' : '');
            if (/[❤️✨💫👑]/.test(text)) {
                item.classList.add('emoji');
            }

            item.textContent = text;

            const posX = 8 + Math.random() * 68;
            const posY = 10 + Math.random() * 75;
            const fontSize = isFar ? (11 + Math.random() * 6) : (15 + Math.random() * 12);

            item.style.left = posX + '%';
            item.style.top = posY + '%';
            item.style.fontSize = fontSize + 'px';

            mosaicContainer.appendChild(item);

            setTimeout(() => item.classList.add('show'), 50);

            setTimeout(() => {
                item.classList.remove('show');
                setTimeout(() => item.remove(), 1200);
            }, 3200);
        }

        for (let i = 0; i < 4; i++) {
            setTimeout(addMosaicElement, i * 450);
        }
        mosaicInterval = setInterval(addMosaicElement, 950);
    }

    function chooseOption(option) {
        if (option === 'si') {
            setImage(images.optionYes, captions.optionYes);
            startMosaic();
        }
        step2Buttons.classList.add('hidden');
        noBtn.style.display = 'none';
    }

    // Botón "No" esquivo
    const noBtn = document.getElementById('no-btn');

    function dodgeNoBtn(e) {
        e.preventDefault();
        e.stopPropagation();
        noBtn.classList.add('floating');

        const rect = noBtn.getBoundingClientRect();
        const margin = 16;
        const maxX = window.innerWidth - rect.width - margin;
        const maxY = window.innerHeight - rect.height - margin;

        const newX = margin + Math.random() * (maxX - margin);
        const newY = margin + Math.random() * (maxY - margin);

        noBtn.style.position = 'fixed';
        noBtn.style.left = newX + 'px';
        noBtn.style.top = newY + 'px';
        noBtn.style.margin = '0';
    }

    noBtn.addEventListener('mouseenter', dodgeNoBtn);
    noBtn.addEventListener('touchstart', dodgeNoBtn, { passive: false });
    noBtn.addEventListener('click', dodgeNoBtn);
</script>

</body>
</html>
